name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-ci.txt
      - run: pip install -e . --no-deps
      - name: Show Ruff canonical diff
        run: |
          ruff check . --fix
          git diff -- src/mlops_control_plane/store.py
          git diff --quiet || exit 1
      - run: pytest -q

  lifecycle-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-ci.txt
      - run: pip install -e . --no-deps
      - name: Run deterministic control-plane lifecycle
        run: |
          mlops-control-plane demo \
            --output /tmp/v0.1_control_plane.json \
            | tee /tmp/v0.1_control_plane.log
      - name: Verify frozen v0.1 evidence
        if: hashFiles('evals/results/v0.1_control_plane.json') != ''
        run: diff -u evals/results/v0.1_control_plane.json /tmp/v0.1_control_plane.json
      - uses: actions/upload-artifact@v4
        with:
          name: v0.1-control-plane-evidence
          path: /tmp/v0.1_control_plane.json
          retention-days: 14
